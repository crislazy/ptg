<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>that's not grass</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script defer src="https://umm.crislzy.hackclub.app/script.js" data-website-id="7078c12b-ca57-431c-a87d-0f1299957503"></script>
<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
  :root {
    --field: #6cbf40;
    --ink: #17210f;
    --soil: #5a3b22;
    --soil-ink: #f2e6d0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --field: #3f8a2a; --ink: #0d1409; --soil: #3b2715; --soil-ink: #e3d6bc;
    }
  }
  :root[data-theme="dark"] {
    --field: #3f8a2a; --ink: #0d1409; --soil: #3b2715; --soil-ink: #e3d6bc;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--field);
    color: var(--ink);
    font-family: "Gochi Hand", "Comic Sans MS", "Chalkboard SE", cursive;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1.5rem 1.25rem 0;
    min-height: 0;
  }
  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(2.8rem, 11vw, 6.5rem);
    line-height: 0.95;
    transform: rotate(1.5deg);
  }
  .sub { margin: 0.9rem 0 0; font-size: clamp(1.3rem, 4vw, 1.9rem); transform: rotate(-0.8deg); }
  .home { margin-top: 0.6rem; font-size: clamp(1.1rem, 3.4vw, 1.5rem); color: var(--ink); -webkit-user-select: text; user-select: text; }
  .count { margin: 0.9rem 0 0; font-size: clamp(1.1rem, 3.4vw, 1.5rem); }
  .msg { margin: 0.2rem 0 0; min-height: 1.5em; font-size: clamp(1rem, 3vw, 1.3rem); }
  .lawn { position: relative; height: 30vh; min-height: 170px; flex: none; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  footer {
    background: var(--soil);
    color: var(--soil-ink);
    padding: 0.7rem 1rem calc(0.7rem + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 1rem;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p class="sub">that's not grass.</p>
  <a class="home" href="/">this page doesn't exist. the grass does.</a>
  <p class="count" aria-live="polite">you touched dead grass <span id="n">0</span> <span id="t">times</span></p>
  <p class="msg" id="msg"></p>
</main>
<div class="lawn"><canvas id="c" aria-label="a patch of dead grass you can touch"></canvas></div>
<footer>this is also the whole website. <a href="/">go back</a>.</footer>

<script>
(function () {
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var nEl = document.getElementById('n'), tEl = document.getElementById('t'), mEl = document.getElementById('msg');
  var W = 0, H = 0, blades = [], running = false, count = 0, travel = 0, last = null;
  var cols = ['#7d6e22', '#9c8a2c', '#b8a23a'];
  var notes = {
    1: 'that\u2019s not even grass.',
    10: 'it was like this when we got here.',
    30: 'the real grass is on the home page.',
    100: 'or outside. outside is better.'
  };

  function build() {
    var dpr = window.devicePixelRatio || 1;
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    blades = [];
    var n = Math.floor(W / 9);
    for (var i = 0; i < n; i++) {
      var h = H * (0.2 + Math.random() * 0.55);
      blades.push({
        x: Math.random() * W, h: h, w: 5 + Math.random() * 6,
        c: cols[Math.floor(Math.random() * cols.length)],
        lean: (Math.random() - 0.5) * 22, bend: 0, v: 0
      });
    }
    blades.sort(function (a, b) { return a.h - b.h; });
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < blades.length; i++) {
      var b = blades[i], o = b.bend + b.lean;
      ctx.fillStyle = b.c;
      ctx.beginPath();
      ctx.moveTo(b.x - b.w / 2, H + 2);
      ctx.quadraticCurveTo(b.x + o * 0.3 - b.w * 0.2, H - b.h * 0.55, b.x + o, H - b.h + Math.abs(o) * 0.25);
      ctx.quadraticCurveTo(b.x + o * 0.3 + b.w * 0.3, H - b.h * 0.55, b.x + b.w / 2, H + 2);
      ctx.fill();
    }
  }

  function step() {
    var energy = 0;
    for (var i = 0; i < blades.length; i++) {
      var b = blades[i];
      b.v += -b.bend * 0.08;
      b.v *= 0.88;
      b.bend += b.v;
      energy += Math.abs(b.v) + Math.abs(b.bend);
    }
    draw();
    if (energy > 0.4) requestAnimationFrame(step); else running = false;
  }
  function kick() { if (!running) { running = true; requestAnimationFrame(step); } }

  function touchGrass(x, y, vx) {
    for (var i = 0; i < blades.length; i++) {
      var b = blades[i], dx = b.x - x;
      if (Math.abs(dx) > 70 || y < H - b.h - 14) continue;
      var prox = 1 - Math.abs(dx) / 70;
      b.v += (dx >= 0 ? 1 : -1) * prox * 1.4 + vx * 0.12 * prox;
      var lim = b.h * 0.45;
      if (b.bend > lim) b.bend = lim; else if (b.bend < -lim) b.bend = -lim;
    }
    kick();
  }

  function bump(by) {
    count += by;
    nEl.textContent = count;
    tEl.textContent = count === 1 ? 'time' : 'times';
    var keys = Object.keys(notes);
    for (var i = 0; i < keys.length; i++) {
      var k = +keys[i];
      if (count - by < k && count >= k) mEl.textContent = notes[k];
    }
  }

  function pos(e) {
    var r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }
  cv.addEventListener('pointermove', function (e) {
    var p = pos(e), vx = last ? p.x - last.x : 0;
    touchGrass(p.x, p.y, vx);
    if (last) {
      travel += Math.abs(vx) + Math.abs(p.y - last.y);
      var hits = Math.floor(travel / 90);
      if (hits) { travel -= hits * 90; bump(hits); }
    }
    last = p;
  });
  cv.addEventListener('pointerdown', function (e) {
    var p = pos(e); last = p; touchGrass(p.x, p.y, 0); bump(1);
  });
  ['pointerleave', 'pointerup', 'pointercancel'].forEach(function (ev) {
    cv.addEventListener(ev, function () { last = null; });
  });
  window.addEventListener('resize', build);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
  build();
})();
</script>
</body>
</html>
